name: Daily Rate Scrape & Deploy
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
jobs:
  update-timestamp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update timestamp
        run: |
          python3 -c "
          import json, datetime
          with open('data/rates.json') as f:
              d = json.load(f)
          d['last_updated'] = datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')
          with open('data/rates.json','w') as f:
              json.dump(d, f, indent=2)
          print('Done:', d['last_updated'])
          "
      - name: Commit and push
        run: |
          git config user.name "MortgageWatch Bot"
          git config user.email "bot@mortgagewatch.ie"
          git add data/rates.json
          git diff --staged --quiet || git commit -m "chore: daily timestamp $(date -u +%Y-%m-%d)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy to server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./data/
          server-dir: ${{ secrets.FTP_REMOTE_PATH }}data/
          include: |
            rates.json
