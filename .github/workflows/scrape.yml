name: Daily Rate Scrape & Deploy

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      lender:
        description: 'Scrape a single lender only (e.g. aib). Leave blank for all.'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — scrape but do not deploy'
        type: boolean
        default: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: |
          pip install -r scraper/requirements.txt

      - name: Install Playwright Chromium
        run: |
          sudo apt-get install -y libasound2t64
          playwright install chromium

      - name: Scrape mortgage rates
        run: |
          cd scraper
          if [ -n "${{ github.event.inputs.lender }}" ]; then
            python scrape.py --lender ${{ github.event.inputs.lender }} --verbose
          else
            python scrape.py --verbose
          fi

      - name: Show rate changes
        run: |
          git diff data/rates.json || echo "No changes to rates.json"

      - name: Commit rates.json
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "MortgageWatch Bot"
          git config user.email "bot@mortgagewatch.ie"
          git add data/rates.json scraper/scrape.log
          git diff --staged --quiet || git commit -m "chore: daily rate update $(date -u +%Y-%m-%d)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy rates.json to server
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./data/
          server-dir: ${{ secrets.FTP_REMOTE_PATH }}data/
          include: |
            rates.json

      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::Rate scrape failed. Existing rates.json retained on server."
